name: migrate
version: 0.2.0
description: |
  Version or framework upgrade with inventory, checklist, rollback plan,
  and step-by-step verification (max 3 thrash attempts per unexpected
  failure). Adopts contracts/self-correcting.md.
self_correcting: true
self_correcting_max_revisions: 3
phases:
  - name: inventory
    model_class: high-reasoning
    goal: Map current→target versions, blast radius, touch points, risks.
    exit_condition: Short inventory with known unknowns listed.
  - name: plan
    model_class: high-reasoning
    goal: Produce ordered checklist, verifications, and rollback plan.
    exit_condition: Checklist + rollback explicit; proceed unless stopped.
  - name: execute
    model_class: workhorse
    goal: Apply upgrade steps one at a time with verification after each.
    exit_condition: Target versions landed; planned checks pass.
  - name: handoff
    model_class: cheap-fast
    goal: Report versions, changes, verification, rollback, residual risk.
    exit_condition: Handoff message sent.
triggers:
  - "upgrade"
  - "migrate"
  - "bump version"
  - "framework upgrade"
  - "major version"
consumes: [intent]
produces: [checklist, code, handoff]
personas:
  inventory: regression-hunter
  plan: api-contract-guardian
  plan_optional: true
