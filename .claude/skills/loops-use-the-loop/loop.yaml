name: use-the-loop
version: 0.1.1
description: |
  Meta conductor. Decision tree over loops that exist in this repo; may
  chain a small composition. Skips ceremony for trivial work.
phases:
  - name: classify
    model_class: high-reasoning
    goal: Pick the smallest fitting loop or composition from the repo catalog.
    exit_condition: Composition stated; user had a beat to redirect.
  - name: run
    model_class: workhorse
    goal: Execute each selected loop fully; respect exit gates between steps. Nested loops follow their own model_class map.
    exit_condition: Composition complete or escalated.
  - name: summarize
    model_class: cheap-fast
    goal: Recap loops run, contributions, state, leftovers.
    exit_condition: Summary sent.
triggers:
  - "use the loop"
  - "loop this"
  - "figure out which loop"
  - "not sure which workflow"
  - "compose a workflow"
consumes: [intent]
produces: [dispatch, composition, handoff]
