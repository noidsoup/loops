name: explain-codebase
version: 0.1.0
description: |
  Onboarding map for an unfamiliar repo: purpose, topology, key directories,
  runtime flows, how to run, and where to start — without dumping the tree.
phases:
  - name: orient
    goal: Skim README, manifests, entry points, and project rules.
    exit_condition: 2–3 sentence product + structure summary is possible.
  - name: map
    goal: Produce a concise contributor map (flows, dirs, commands, conventions).
    exit_condition: A new contributor can find the right place for a typical change.
  - name: handoff
    goal: Start-here list, footguns, open questions, optional next loop.
    exit_condition: Handoff message sent.
triggers:
  - "explain this codebase"
  - "onboarding"
  - "map the repo"
  - "how does this work"
  - "where do I start"
consumes: [intent]
produces: [map, handoff]
