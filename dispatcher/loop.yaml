name: dispatcher
version: 0.1.0
description: |
  Meta-loop. The entry point. Reads user intent, classifies it against the
  available loops, and dispatches to the right one. Never executes a task
  directly — only routes.
# Classification stays on the current session model. After dispatch, the
# chosen loop owns model_class behavior for its phases (see adapters/MODEL_CLASSES.md).
model_class: workhorse
triggers:
  - "use the loops"
  - "loops?"
  - "which loop"
classification:
  options:
    - plan-and-implement
    - tdd
    - sar
    - adversarial-gate
    - reproduce-and-fix
    - migrate
    - explain-codebase
    - swarm
    - use-the-loop
  method: llm-intent-classification
  fallback: use-the-loop
  priority_keywords:
    swarm: [swarm, "swarm this", "run the swarm", "full pipeline"]
consumes: []
produces: [dispatch]
